server_tokens off;

# HTTP → HTTPS（通配承接，任何域名/裸 IP 都跳主域名）
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
  location / { return 301 https://juchengcc.com$request_uri; }
}

# www → 主域名
server {
  listen 443 ssl;
  http2 on;
  server_name www.juchengcc.com;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  return 301 https://juchengcc.com$request_uri;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name juchengcc.com;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 520m;

  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

  location ~ ^/api/v1/assistant/tasks/[a-f0-9]+/stream$ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1000s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }
  # MCP Streamable HTTP：关闭缓冲以支持流式响应
  location = /mcp {
    proxy_pass http://api:8000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
  location /health { proxy_pass http://api:8000/health; }
}

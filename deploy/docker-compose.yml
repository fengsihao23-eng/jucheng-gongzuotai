# 单机部署：nginx(80/443) + api(FastAPI + 内置定时任务 + MCP) + db(PostgreSQL 17)
# 生产可把 db 换成腾讯云 PostgreSQL / 托管库，只需改 DATABASE_URL 并删除 db 服务
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: jucheng
      POSTGRES_USER: jucheng
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 deploy/.env 设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jucheng"], interval: 5s, retries: 10 }
  api:
    build:
      context: ../backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://jucheng:${DB_PASSWORD}@db:5432/jucheng
      APP_REVISION: ${APP_REVISION:-}
      STORAGE_DIR: /data/files
      ASSISTANT_SANDBOX_ENABLED: "true"
      ASSISTANT_WORKSPACE_ROOT: /workspaces
      ASSISTANT_WORKSPACE_VOLUME: jucheng_xiaoju_workspaces
    volumes: [files:/data, workspaces:/workspaces, /var/run/docker.sock:/var/run/docker.sock]
    depends_on: { db: { condition: service_healthy } }
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]
  xiaoju-workspace:
    image: jucheng-xiaoju-workspace:1.3.0
    build:
      context: ../backend/agent_runtime
      dockerfile: Dockerfile.workspace
      args:
        APT_MIRROR: ${WORKSPACE_APT_MIRROR:-${APT_MIRROR:-}}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    profiles: [build]
  backup:
    image: postgres:17
    restart: unless-stopped
    environment: { PGPASSWORD: "${DB_PASSWORD}" }
    # 上传文件卷只读挂载：知识库原件、导入资料、合同归档、报表都在 /data/files
    volumes: [./backups:/backups, files:/data:ro]
    # 每日 02:30 备份数据库 + 上传文件，各保留 7 天（PRD 9：RPO ≤ 24h）。只放在本机，异地备份见 docs/KB_AND_IMPORTS.md
    entrypoint: ["sh", "-c", "while true; do sleep $$(( ($$(date -d 'tomorrow 02:30' +%s) - $$(date +%s)) )); d=$$(date +%F); pg_dump -h db -U jucheng -Fc jucheng > /backups/jucheng_$$d.dump && tar -czf /backups/files_$$d.tar.gz -C /data files; find /backups -name 'jucheng_*.dump' -mtime +7 -delete; find /backups -name 'files_*.tar.gz' -mtime +7 -delete; done"]
    depends_on: [db]
volumes:
  pgdata: {}
  files: {}
  workspaces:
    name: jucheng_xiaoju_workspaces
